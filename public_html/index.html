<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
  (function(){
    if (/bot|crawl|spider|slurp|mediapartners|facebookexternalhit|embedly|preview|lighthouse|headless/i.test(navigator.userAgent)) return;
    var l = null;
    try { l = localStorage.getItem('sb-lang'); } catch (e) {}
    if (l !== 'en' && l !== 'es') l = (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
    location.replace('/' + l + '/' + location.search + location.hash);
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackbit — Custom software, web and automation</title>
  <meta name="description" content="Stackbit is a remote software studio for businesses of any size, worldwide. Choose your language.">
  <meta name="robots" content="noindex, follow">
  <link rel="alternate" hreflang="en" href="https://stackbitcr.com/en/">
  <link rel="alternate" hreflang="es" href="https://stackbitcr.com/es/">
  <link rel="alternate" hreflang="x-default" href="https://stackbitcr.com/en/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{color-scheme:light dark}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,-apple-system,sans-serif;background:#080808;color:#f4f4f5}
    @media (prefers-color-scheme:light){body{background:#fafafa;color:#111}}
    main{text-align:center;padding:2rem 16px}
    h1{font-size:1.75rem;font-weight:900;letter-spacing:-.04em;margin:0 0 1.5rem}
    nav{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
    a{display:inline-block;padding:.75rem 1.5rem;border-radius:10px;border:1px solid currentColor;color:inherit;text-decoration:none;font-weight:600}
    a:hover{color:#4f8fff}
  </style>
</head>
<body>
  <main>
    <h1>Stackbit</h1>
    <nav aria-label="Language">
      <a href="/en/" hreflang="en" lang="en">English</a>
      <a href="/es/" hreflang="es" lang="es">Español</a>
    </nav>
  </main>
</body>
</html>
